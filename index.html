</head>

<body>

<div id="filemanager"></div>

<script>
(function() {
    const GITHUB_OWNER = "imKUMOCHAN";
    const GITHUB_REPO  = "cdn";
    const GITHUB_BRANCH = "main";

    const CDN_BASE = "https://cdn.kumochan.com/";

    const API_BASE =
        "https://api.github.com/repos/" +
        encodeURIComponent(GITHUB_OWNER) +
        "/" +
        encodeURIComponent(GITHUB_REPO) +
        "/contents/";

    function encodePath(path) {
        return path
            .split("/")
            .map(encodeURIComponent)
            .join("/");
    }

    function getCDNURL(path) {
        if (!path) {
            return CDN_BASE;
        }

        return CDN_BASE + encodePath(path);
    }

    async function getDirectory(path) {

        const url =
            API_BASE +
            encodePath(path) +
            "?ref=" +
            encodeURIComponent(GITHUB_BRANCH);

        const response = await fetch(url, {
            headers: {
                "Accept": "application/vnd.github+json"
            }
        });

        if (!response.ok) {
            throw new Error(
                "GitHub API returned HTTP " + response.status
            );
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
            throw new Error(
                "GitHub did not return a directory."
            );
        }

        return data;
    }

    function convertEntries(items) {
        return items.map(function(item) {
            const isFolder = item.type === "dir";
            return {
                name: item.name,
                type: isFolder
                    ? "folder"
                    : "file",
                id: item.path,
                hash: item.path,
                size: isFolder
                    ? undefined
                    : item.size,
                tooltip:
                    isFolder
                        ? "Folder"
                        : (
                            "File\n" +
                            "Size: " +
                            formatBytes(item.size || 0)
                        ),
                url: getCDNURL(item.path)
            };
        });
    }

    function formatBytes(bytes) {
        if (!bytes) {
            return "0 B";
        }
        const units = [
            "B",
            "KB",
            "MB",
            "GB",
            "TB"
        ];

        let i = 0;
        let value = bytes;

        while (value >= 1024 && i < units.length - 1) {
            value /= 1024;
            i++;
        }
        return value.toFixed(
            i === 0 ? 0 : 2
        ) + " " + units[i];
    }

    const elem =
        document.getElementById("filemanager");
    const options = {
        initpath: [
            [
                "",
                "KUMOCHAN CDN",
                {
                    canmodify: false
                }
            ]
        ],
        onrefresh: function(folder, required) {

            const explorer = this;

            const pathIDs =
                folder.GetPathIDs();
            let path = "";

            if (pathIDs.length > 1) {
                path = pathIDs
                    .slice(1)
                    .map(function(part) {
                        return part[0];
                    })
                    .join("/");
            }
            getDirectory(path)
                .then(function(items) {
                    const entries =
                        convertEntries(items);
                    folder.SetEntries(entries);
                })
                .catch(function(error) {
                    console.error(
                        "Failed to load directory:",
                        error
                    );
                    if (required) {
                        explorer.SetNamedStatusBarText(
                            "folder",
                            explorer.EscapeHTML(
                                "Failed to load folder: " +
                                error.message
                            )
                        );
                    }
                });
        },
        onopenfile: function(folder, entry) {
            if (!entry.url) {
                return;
            }
            window.open(
                entry.url,
                "_blank"
            );
        },
        tools: {
            new_folder: false,
            new_file: false,
            upload: false,
            download: false,
            copy: false,
            paste: false,
            cut: false,
            delete: false,
            item_checkboxes: false
        }
    };
    const explorer =
        new window.FileExplorer(
            elem,
            options
        );

})();
</script>

</body>
</html>
